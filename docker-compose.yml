services:
  postgres:
    image: postgres:16-alpine
    container_name: isp_noc_postgres
    environment:
      POSTGRES_DB: isp_noc
      POSTGRES_USER: isp_noc
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_noc -d isp_noc"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: isp_noc_backend
    env_file:
      - ./backend/.env.example
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: isp_noc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
